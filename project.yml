# Business Miles – Mac-App + Widget. Projektdefinition für XcodeGen (https://github.com/yonaskolb/XcodeGen)
# Erzeugen:  xcodegen generate   →   BusinessMiles.xcodeproj öffnen
#
# >>> Vor dem ersten Build die beiden Werte unter settings.base anpassen:
#     BUNDLE_ID_PREFIX  – eigene, umgekehrte Domain (z. B. de.meinefirma)
#     DEVELOPMENT_TEAM  – Team-ID deines kostenlosen Apple-Accounts (Xcode → Settings → Accounts → Team)
#
# Kein kostenpflichtiger Apple-Developer-Account nötig: Die Daten liegen in OneDrive,
# nicht in iCloud. Die Mac-App läuft mit der kostenlosen Apple-ID dauerhaft.

name: BusinessMiles

options:
  bundleIdPrefix: de.example
  developmentLanguage: de
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    BUNDLE_ID_PREFIX: de.example
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES

targets:

  BusinessMiles:
    type: application
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/App
      - path: Resources/Assets.xcassets
      - path: Resources/plz.json
        buildPhase: resources
    dependencies:
      - target: BusinessMilesWidget
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Business Miles
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [businessmiles]
        # App Group (Team-ID als Präfix) – darüber bekommt das Widget seine Zahlen
        BMAppGroupID: $(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).businessmiles
    entitlements:
      path: Config/BusinessMiles.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.application-groups: [$(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).businessmiles]
    settings:
      base:
        PRODUCT_NAME: Business Miles
        PRODUCT_MODULE_NAME: BusinessMiles
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).businessmiles
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

  BusinessMilesWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/Widget
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Business Miles
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        BMAppGroupID: $(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).businessmiles
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).businessmiles]
    settings:
      base:
        PRODUCT_NAME: BusinessMilesWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).businessmiles.widget
        SKIP_INSTALL: YES

schemes:
  BusinessMiles:
    build:
      targets:
        BusinessMiles: all
    run:
      config: Debug
