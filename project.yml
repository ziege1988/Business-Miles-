# Business Miles – Mac-App (mit Schreibtisch-Widget). Projektdefinition für XcodeGen (https://github.com/yonaskolb/XcodeGen)
# Erzeugen:  xcodegen generate   →   BusinessMiles.xcodeproj öffnen
#
# Normalerweise baust du nichts selbst: GitHub baut die App automatisch und stellt sie
# als ZIP unter „Releases“ bereit (siehe .github/workflows/mac-app.yml).
#
# Signatur: „Sign to Run Locally“ (ad hoc) – keine Apple-ID, keine Team-ID, kein Developer-Account.

name: BusinessMiles

options:
  bundleIdPrefix: de.example
  developmentLanguage: de
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    BUNDLE_ID_PREFIX: app.businessmiles
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES

targets:

  BusinessMiles:
    type: application
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/App
      - path: Resources/Assets.xcassets
      - path: Resources/plz.json
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Business Miles
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [businessmiles]
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_NAME: Business Miles
        PRODUCT_MODULE_NAME: BusinessMiles
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).businessmiles
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

schemes:
  BusinessMiles:
    build:
      targets:
        BusinessMiles: all
    run:
      config: Debug
