# Business Miles – Projektdefinition für XcodeGen (https://github.com/yonaskolb/XcodeGen)
# Erzeugen:  xcodegen generate   →   BusinessMiles.xcodeproj öffnen
#
# >>> Vor dem ersten Build die beiden Werte unter settings.base anpassen:
#     BUNDLE_ID_PREFIX  – eigene, umgekehrte Domain (z. B. de.meinefirma)
#     DEVELOPMENT_TEAM  – Team-ID aus developer.apple.com → Membership (10 Zeichen)

name: BusinessMiles

options:
  bundleIdPrefix: de.example
  developmentLanguage: de
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    BUNDLE_ID_PREFIX: de.example
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES

targets:

  # ------------------------------------------------------------------ iPhone
  BusinessMiles-iOS:
    type: application
    platform: iOS
    sources: &appSources
      - path: Sources/Core
      - path: Sources/App
      - path: Resources/Assets.xcassets
    dependencies:
      - target: BusinessMilesWidget-iOS
    info:
      path: Config/iOS/Info.plist
      properties:
        CFBundleDisplayName: Business Miles
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSPhotoLibraryAddUsageDescription: Business Miles speichert exportierte Fahrtenlisten als Bild in deiner Fotomediathek.
        CFBundleURLTypes: &urlTypes
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [businessmiles]
        BMAppGroupID: group.$(BUNDLE_ID_PREFIX).businessmiles
        BMCloudKitContainerID: iCloud.$(BUNDLE_ID_PREFIX).businessmiles
    entitlements:
      path: Config/iOS/BusinessMiles.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).businessmiles]
        com.apple.developer.icloud-container-identifiers: [iCloud.$(BUNDLE_ID_PREFIX).businessmiles]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Business Miles
        PRODUCT_MODULE_NAME: BusinessMiles
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).businessmiles
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BusinessMilesWidget-iOS:
    type: app-extension
    platform: iOS
    sources: &widgetSources
      - path: Sources/Core
      - path: Sources/Widget
    info:
      path: Config/iOS/Widget-Info.plist
      properties:
        CFBundleDisplayName: Business Miles
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension: &widgetExtension
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        BMAppGroupID: group.$(BUNDLE_ID_PREFIX).businessmiles
    entitlements:
      path: Config/iOS/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).businessmiles]
    settings:
      base:
        PRODUCT_NAME: BusinessMilesWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).businessmiles.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # ------------------------------------------------------------------- macOS
  BusinessMiles-macOS:
    type: application
    platform: macOS
    sources: *appSources
    dependencies:
      - target: BusinessMilesWidget-macOS
    info:
      path: Config/macOS/Info.plist
      properties:
        CFBundleDisplayName: Business Miles
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        NSHumanReadableCopyright: ""
        CFBundleURLTypes: *urlTypes
        # macOS: App-Group-ID mit Team-ID als Präfix
        BMAppGroupID: $(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).businessmiles
        BMCloudKitContainerID: iCloud.$(BUNDLE_ID_PREFIX).businessmiles
    entitlements:
      path: Config/macOS/BusinessMiles.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.application-groups: [$(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).businessmiles]
        com.apple.developer.icloud-container-identifiers: [iCloud.$(BUNDLE_ID_PREFIX).businessmiles]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Business Miles
        PRODUCT_MODULE_NAME: BusinessMiles
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).businessmiles
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  BusinessMilesWidget-macOS:
    type: app-extension
    platform: macOS
    sources: *widgetSources
    info:
      path: Config/macOS/Widget-Info.plist
      properties:
        CFBundleDisplayName: Business Miles
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension: *widgetExtension
        BMAppGroupID: $(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).businessmiles
    entitlements:
      path: Config/macOS/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).businessmiles]
    settings:
      base:
        PRODUCT_NAME: BusinessMilesWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).businessmiles.widget
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

schemes:
  BusinessMiles-iOS:
    build:
      targets:
        BusinessMiles-iOS: all
    run:
      config: Debug
  BusinessMiles-macOS:
    build:
      targets:
        BusinessMiles-macOS: all
    run:
      config: Debug
