# Veröffentlicht die iPhone-Web-App (Ordner web/) auf GitHub Pages.
# Läuft bei jeder Änderung auf main sowie manuell (Actions → „Web-App veröffentlichen“ → Run workflow).
name: Web-App veröffentlichen

on:
  push:
    branches: [main]
    paths: ["web/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test tests/model.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
