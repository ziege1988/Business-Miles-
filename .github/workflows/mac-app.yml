# Baut die Mac-App auf einem Mac von GitHub und stellt sie als ZIP bereit.
# - Bei jedem Push: Build-Prüfung + ZIP als „Artifact“ (Actions → Lauf → unten „Artifacts“)
# - Auf dem Standard-Zweig: zusätzlich ein Release mit der ZIP-Datei (Repository-Seite → „Releases“)
# - Commit-Nachricht mit „[screenshots]“ oder manueller Start: Bildschirmfotos mit Beispieldaten → docs/screenshots
name: Mac-App bauen

on:
  push:
    branches: [main, "claude/**"]
    paths: ["Sources/**", "Resources/**", "project.yml", ".github/workflows/mac-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (ohne Apple-Team, ad hoc signiert)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project BusinessMiles.xcodeproj \
            -scheme BusinessMiles \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*(deprecated)?|BUILD (SUCCEEDED|FAILED)" || true
          test -d "build/Build/Products/Release/Business Miles.app"

      - name: Fehlerprotokoll
        if: failure()
        run: grep -n "error:" xcodebuild.log | head -100 || true

      - name: Signatur prüfen und ZIP erstellen
        run: |
          APP="build/Build/Products/Release/Business Miles.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" Business-Miles-Mac.zip
          ls -la Business-Miles-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Business-Miles-Mac
          path: Business-Miles-Mac.zip

      - name: Bildschirmfotos mit Beispieldaten
        if: contains(github.event.head_commit.message, '[screenshots]') || github.event_name == 'workflow_dispatch'
        run: |
          APP="build/Build/Products/Release/Business Miles.app"
          mkdir -p shots
          "$APP/Contents/MacOS/Business Miles" --screenshots "$PWD/shots" &
          PID=$!
          for i in $(seq 1 90); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          for f in shots/*.pdf; do [ -f "$f" ] && sips -s format png "$f" --out "${f%.pdf}.png" >/dev/null || true; done
          ls -la shots

      - name: Bildschirmfotos ins Repository
        if: contains(github.event.head_commit.message, '[screenshots]') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p docs/screenshots
          cp shots/* docs/screenshots/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "Bildschirmfotos der Mac-App aktualisiert"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Release veröffentlichen (Standard-Zweig)
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Release-Notizen = Commit-Nachricht ohne technische Zeilen
          printf '%s\n' "$COMMIT_MESSAGE" | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed 's/ \[screenshots\]//' > notes.txt
          [ -s notes.txt ] || echo "Verbesserungen und Fehlerbehebungen" > notes.txt
          gh release create "mac-build-${{ github.run_number }}" Business-Miles-Mac.zip \
            --title "Business Miles für Mac – Build ${{ github.run_number }}" \
            --notes-file notes.txt \
            --latest
